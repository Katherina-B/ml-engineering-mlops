stages:
  load_date:
    cmd: python load_date.py
    params:
      - data
    deps:
      - load_date.py
    outs:
      - data/102flower

  train:
    cmd: python train.py
    params:
      - training.epochs
      - training.batch_size
      - training.optimizer
      - model
      - logging
      - artifacts
    deps:
      - data/102flower
      - train.py
    outs:
      - artifacts/best_model.pth
      - logs/training.log

  evaluate:
    cmd: python evaluate.py
    params:
      - evaluation.metrics
      - artifacts.output_dir
    deps:
      - artifacts/best_model.pth
      - data/102flower
      - evaluate.py
    metrics:
      - artifacts/metrics.json
