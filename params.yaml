# Data configuration
data:
  local_dir: /content/lb3/data/102flower
  dataset_url: https://www.robots.ox.ac.uk/~vgg/data/flowers/102/102flowers.tgz
  label_url: https://www.robots.ox.ac.uk/~vgg/data/flowers/102/imagelabels.mat

dataset:
  random_seed: 42
  input_shape: [225, 225, 3]
  num_classes: 102

# Training configuration
training:
  epochs: 2
  batch_size: 32
  optimizer:
    name: AdamW
    lr: 0.0001
  loss: CrossEntropyLoss
  metrics:
    - accuracy
    - f1_score
    - precision
    - recall

# Model configuration
model:
  name: InceptionV3
  pretrained: True
  num_classes: 102
  freeze_base: False

# Logging configuration
logging:
  level: INFO
  file: /content/lb3/logs/training.log
  format: '%(asctime)s - %(levelname)s - %(message)s'

# Artifacts configuration
artifacts:
  output_dir: /content/lb3/artifacts
  model_file: /content/lb3/artifacts/model.pth
  best_model_file: /content/lb3/artifacts/best_model.pth
  save_best_model: True
  save_logs: True
  save_metrics: True
  save_confusion_matrix: True


# Evaluation configuration
evaluation:
  metrics:
    - accuracy
    - f1_score
    - precision
    - recall
  compute_confusion_matrix: True
